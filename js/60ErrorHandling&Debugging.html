<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Error Handling JavaScript</title>
</head>

<body>

<h1>Error Handling & Debugging</h1>

<script>
// try...catch
try {
    let hasil = JSON.parse("bukan json");
} catch (error) {
    console.log("Error:", error.message);
} finally {
    console.log("Selalu dijalankan");
}

// Throw Custom Error
function bagi(a, b) {
    if (b === 0) throw new Error("Tidak bisa bagi dengan 0");
    return a / b;
}

try {
    console.log("Hasil:", bagi(10, 2));
    console.log("Hasil:", bagi(10, 0));
} catch (error) {
    console.log(error.message);
}

// Debugging
const array = ["Apel", "Mangga", "Jeruk"];

console.log("Debug:", array);
console.table(array);

console.time("proses");
for (let i = 0; i < 1000000; i++) {}
console.timeEnd("proses");

// Breakpoint
debugger;

document.write("<p>Buka Console (F12) untuk melihat hasil.</p>");
</script>

</body>
</html>
