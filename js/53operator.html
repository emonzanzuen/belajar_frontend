<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Operator JavaScript</title>
</head>

<body>

<h1>Operator JavaScript</h1>

<script>
// Aritmatika
let a = 10, b = 3;

console.log("Penjumlahan :", a + b);
console.log("Pengurangan :", a - b);
console.log("Perkalian :", a * b);
console.log("Pembagian :", a / b);
console.log("Modulus :", a % b);
console.log("Pangkat :", a ** b);

// Perbandingan
console.log(5 == "5");    // true
console.log(5 === "5");   // false
console.log(5 !== 3);     // true
console.log(5 > 3);       // true

// Logika
console.log(true && false); // false
console.log(true || false); // true
console.log(!true);         // false

// Increment & Decrement
let x = 5;
x++;
console.log("Setelah x++ :", x);

x--;
console.log("Setelah x-- :", x);

// Tampilkan di halaman
document.write("<h3>Hasil Aritmatika</h3>");
document.write("10 + 3 = " + (a + b) + "<br>");
document.write("10 - 3 = " + (a - b) + "<br>");
document.write("10 × 3 = " + (a * b) + "<br>");
document.write("10 ÷ 3 = " + (a / b) + "<br>");
document.write("10 % 3 = " + (a % b) + "<br>");
document.write("10³ = " + (a ** b) + "<br>");
</script>

</body>
</html>
