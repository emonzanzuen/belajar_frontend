<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Percabangan JavaScript</title>
</head>

<body>

<h1>Percabangan JavaScript</h1>

<script>
// if...else
let umur = 18;

if (umur >= 18) {
    console.log("Dewasa");
} else if (umur >= 13) {
    console.log("Remaja");
} else {
    console.log("Anak-anak");
}

// Ternary Operator
let status = umur >= 18 ? "Dewasa" : "Anak-anak";
console.log("Status:", status);

// Switch
let hari = "Senin";

switch (hari) {
    case "Senin":
        console.log("Awal minggu");
        break;

    case "Jumat":
        console.log("TGIF!");
        break;

    default:
        console.log("Hari biasa");
}

// Tampilkan di halaman
document.write("<p>Umur: " + umur + "</p>");
document.write("<p>Status: " + status + "</p>");
document.write("<p>Hari: " + hari + "</p>");

</script>

</body>
</html>
