<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>

    <style>
        /* Flex Container */
        .container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Flex Items */
        .item {
            flex: 1;
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px;
            align-self: flex-end;
            order: -1;
        }
    </style>
</head>

<body>

    <h1>CSS Flexbox</h1>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

</body>
</html>
