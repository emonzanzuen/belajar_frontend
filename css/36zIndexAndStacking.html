<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Z-Index</title>

    <style>
        .modal {
            position: fixed;
            z-index: 1000;
        }

        .dropdown {
            position: absolute;
            z-index: 100;
        }

        .tooltip {
            position: absolute;
            z-index: 50;
        }

        /* Stacking Order (belakang ke depan):
           1. background/border elemen
           2. positioned elements (negatif z-index)
           3. non-positioned elements
           4. positioned elements (positif z-index)
        */
    </style>
</head>

<body>

    <h1>CSS Z-Index</h1>

    <div class="modal">
        Modal
    </div>

    <div class="dropdown">
        Dropdown
    </div>

    <div class="tooltip">
        Tooltip
    </div>

</body>
</html>
