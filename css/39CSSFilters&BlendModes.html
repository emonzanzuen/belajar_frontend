<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters dan Blend Mode</title>

    <style>
        .image {
            /* Filters */
            filter: blur(5px);
            filter: brightness(1.5);
            filter: contrast(200%);
            filter: grayscale(100%);
            filter: sepia(100%);
            filter: hue-rotate(90deg);
            filter: drop-shadow(5px 5px 10px black);

            /* Multiple filters */
            filter: brightness(0.8) contrast(1.2);
        }

        .overlay {
            background: rgba(0, 0, 0, 0.5);
            mix-blend-mode: multiply;
            /* multiply, screen, overlay, darken, lighten, color-dodge */
        }
    </style>
</head>

<body>

    <h1>CSS Filters dan Blend Mode</h1>

    <!-- Filters -->
    <h2>CSS Filters</h2>

    <img 
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRREE85AP9IC05CoGxdexUJo4nVXSmvbj3_C0OKxd9VZQ&s=10" 
        alt="Contoh gambar"
        class="image"
        width="300">

    <!-- Blend Mode -->
    <h2>Mix Blend Mode</h2>

    <div class="overlay">
        Contoh overlay dengan mix-blend-mode.
    </div>

</body>
</html>
