<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors & Background</title>

    <style>
        /* Warna */
        .box {
            color: red;
        }

        /* Background */
        .hero {
            background-color: #1a1a2e;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 30px;
            color: white;
        }

        /* Gradient */
        .gradient {
            background: linear-gradient(135deg, #6C63FF, #FF6584);
            padding: 30px;
            color: white;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <h1>CSS Colors & Background</h1>

    <!-- Warna -->
    <div class="box">
        <h2>Warna</h2>
        <p>Nama warna: red</p>
        <p>Hex: #ff0000</p>
        <p>RGB: rgb(255, 0, 0)</p>
        <p>RGBA: rgba(255, 0, 0, 0.5)</p>
        <p>HSL: hsl(0, 100%, 50%)</p>
    </div>

    <!-- Background -->
    <div class="hero">
        <h2>Background</h2>
        <p>
            Contoh penggunaan background-color,
            background-image, dan properti background lainnya.
        </p>
    </div>

    <!-- Gradient -->
    <div class="gradient">
        <h2>Gradient</h2>
        <p>
            Gradient menggunakan linear-gradient().
        </p>
    </div>

</body>
</html>
