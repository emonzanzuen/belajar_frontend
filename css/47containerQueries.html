<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Container Query</title>

<style>
.card-container {
    width: 350px;
    margin: auto;
    border: 1px solid #ccc;
    padding: 10px;

    container-type: inline-size;
    container-name: card;
}

.card {
    gap: 10px;
    border: 1px solid #999;
    padding: 10px;
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

@container card (min-width: 400px) {
    .card {
        display: flex;
        flex-direction: row;
    }

    .card img {
        width: 200px;
        height: 100%;
    }
}

@container card (max-width: 399px) {
    .card {
        display: flex;
        flex-direction: column;
    }
}
</style>

</head>
<body>

<h2>Container Query</h2>

<div class="card-container">
    <div class="card">
        <img src="https://picsum.photos/200" alt="Gambar">
        <div>
            <h3>Judul Card</h3>
            <p>Ukuran card berubah mengikuti ukuran container.</p>
        </div>
    </div>
</div>

</body>
</html>
