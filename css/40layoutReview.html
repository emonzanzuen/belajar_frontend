<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Layout dengan Grid</title>

    <style>
        /* Blog Layout dengan Grid */
        .blog-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            min-height: 100vh;
            gap: 1rem;
        }

        .header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
        }

        .sidebar {
            grid-area: sidebar;
        }

        .main {
            grid-area: main;
        }

        .footer {
            grid-area: footer;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .blog-layout {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "main"
                    "sidebar"
                    "footer";
            }
        }
    </style>
</head>

<body>

    <div class="blog-layout">

        <header class="header">
            <h1>My Blog</h1>

            <nav>
                <a href="#">Home</a>
                <a href="#">Blog</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>Kategori</p>
            <p>Artikel Terbaru</p>
        </aside>

        <main class="main">
            <h2>Artikel Blog</h2>
            <p>
                Ini adalah contoh konten utama pada halaman blog
                menggunakan CSS Grid.
            </p>
        </main>

        <footer class="footer">
            <p>&copy; 2026 My Blog</p>
        </footer>

    </div>

</body>
</html>
