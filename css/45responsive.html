<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Queries</title>

    <style>
        /* Media Queries */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
        }

        @media (min-width: 1024px) {
            .sidebar {
                display: block;
            }
        }

        /* Mobile-first approach */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>CSS Media Queries</h1>

    <!-- Container -->
    <div class="container">
        <p>Container Responsive</p>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <p>Sidebar</p>
    </div>

    <!-- Mobile-first Grid -->
    <h2>Responsive Grid</h2>

    <div class="grid">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
        <div>Item 4</div>
        <div>Item 5</div>
        <div>Item 6</div>
    </div>

</body>
</html>
