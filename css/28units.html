<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>

    <style>
        /* Absolute Unit */
        .px {
            width: 200px;
            background: lightblue;
        }

        /* Relative Units */
        .percent {
            width: 50%;
            background: lightgreen;
        }

        .em {
            font-size: 1.5em;
            background: #eee;
        }

        .rem {
            font-size: 1rem;
            background: #ddd;
        }

        .vw {
            width: 50vw;
            background: orange;
        }

        .vh {
            height: 100vh;
            background: lightcoral;
        }

        .vmin {
            width: 100vmin;
            background: #6C63FF;
            color: white;
        }

        .box {
            padding: 15px;
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <h1>CSS Units</h1>

    <h2>Absolute Unit</h2>

    <div class="box px">
        200px
    </div>


    <h2>Relative Units</h2>

    <div class="box percent">
        50%
    </div>

    <div class="box em">
        1.5em
    </div>

    <div class="box rem">
        1rem
    </div>

    <div class="box vw">
        50vw
    </div>

    <div class="box vh">
        100vh
    </div>

    <div class="box vmin">
        100vmin
    </div>

</body>
</html>
