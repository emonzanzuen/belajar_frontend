<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Cara Menambahkan CSS</title>

    <!-- 3. External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 1. Inline CSS -->
    <h1 style="color: blue; font-size: 24px;">
        Inline CSS
    </h1>

    <!-- 2. Internal CSS -->
    <style>
        h2 {
            color: blue;
            font-size: 24px;
        }
    </style>

    <h2>Internal CSS</h2>

    <!-- 3. External CSS -->
    <h3>External CSS</h3>

</body>
</html>
